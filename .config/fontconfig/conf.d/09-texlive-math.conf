<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 让 fontconfig 扫描 /opt/texlive/2025/texmf-dist/fonts/opentype/public/ -->
  <dir>/opt/texlive/2025/texmf-dist/fonts/opentype/public/</dir>
  <!-- 如果你想让它也扫描用户本地 texmf，可加下面这一行 -->
  <dir>~/.local/share/fonts</dir>
</fontconfig>
