# Yazi keymap - Ranger style key bindings
# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
"$schema" = "https://yazi-rs.github.io/schemas/keymap.json"

[mgr]
prepend_keymap = [
	{ on = "<Enter>", run = 'plugin smart-enter' },
	{ on = "l", run = 'plugin smart-enter' },
	{ on = ["`", "a"], run = "plugin yamb --args=save", desc = "Add bookmark" },
	{ on = ["`", "'"], run = "plugin yamb --args=jump_by_fzf", desc = "Jump bookmark by fzf" },
	{ on = ["`", "r"], run = "plugin yamb --args=delete_by_key", desc = "Delete bookmark by key" },
]

keymap = [
	# ===== Basic Operations =====
	{ on = "<Esc>", run = "escape", desc = "Exit visual mode/Deselect/Cancel search" },
	{ on = "q", run = "close", desc = "Close current tab or quit" },
	{ on = "Q", run = "quit --no-cwd-file", desc = "Force quit" },
	{ on = ["Z", "Z"], run = "quit", desc = "Quit (ZZ)" },
	{ on = ["Z", "Q"], run = "quit --no-cwd-file", desc = "Force quit (ZQ)" },

	{ on = "R", run = "refresh", desc = "Refresh current directory" },
	{ on = "<C-l>", run = "refresh", desc = "Redraw window" },
	{ on = "<C-c>", run = "escape", desc = "Cancel operation" },

	# ===== Navigation (Vim style) =====
	{ on = "k", run = "arrow -1", desc = "Move up" },
	{ on = "j", run = "arrow 1", desc = "Move down" },
	{ on = "h", run = "leave", desc = "Go to parent directory" },
	{ on = "l", run = "enter", desc = "Enter directory/Open file" },

	{ on = "<Up>", run = "arrow -1", desc = "Move up" },
	{ on = "<Down>", run = "arrow 1", desc = "Move down" },
	{ on = "<Left>", run = "leave", desc = "Go to parent directory" },
	{ on = "<Right>", run = "enter", desc = "Enter directory/Open file" },

	{ on = ["g", "g"], run = "arrow -99999999", desc = "Go to top" },
	{ on = "G", run = "arrow 99999999", desc = "Go to bottom" },
	{ on = "<Home>", run = "arrow -99999999", desc = "Go to top" },
	{ on = "<End>", run = "arrow 99999999", desc = "Go to bottom" },

	# Half page/Full page scroll
	{ on = "J", run = "arrow 50%", desc = "Half page down" },
	{ on = "K", run = "arrow -50%", desc = "Half page up" },
	{ on = "<C-d>", run = "arrow 50%", desc = "Half page down" },
	{ on = "<C-u>", run = "arrow -50%", desc = "Half page up" },
	{ on = "<C-f>", run = "arrow 100%", desc = "Page down" },
	{ on = "<C-b>", run = "arrow -100%", desc = "Page up" },
	{ on = "<PageDown>", run = "arrow 100%", desc = "Page down" },
	{ on = "<PageUp>", run = "arrow -100%", desc = "Page up" },

	# History navigation
	{ on = "H", run = "back", desc = "Go back in history" },
	{ on = "L", run = "forward", desc = "Go forward in history" },

	# Parent directory navigation
	{ on = "[", run = "parent_arrow -1", desc = "Parent directory up" },
	{ on = "]", run = "parent_arrow 1", desc = "Parent directory down" },

	# ===== Preview Scroll =====
	{ on = "<A-j>", run = "seek 5", desc = "Scroll preview down" },
	{ on = "<A-k>", run = "seek -5", desc = "Scroll preview up" },

	# ===== Selection/Mark =====
	{ on = "<Space>", run = ["toggle", "arrow 1"], desc = "Toggle selection and move down" },
	{ on = "v", run = "toggle_all", desc = "Invert selection" },
	{ on = ["u", "v"], run = "escape --select", desc = "Deselect all" },
	{ on = "V", run = "visual_mode", desc = "Enter visual mode" },
	{ on = ["u", "V"], run = "visual_mode --unset", desc = "Visual mode (unset)" },
	{ on = "<C-a>", run = "toggle_all --state=on", desc = "Select all" },

	# ===== Search =====
	{ on = "/", run = "find --smart", desc = "Search files" },
	{ on = "n", run = "find_arrow", desc = "Next match" },
	{ on = "N", run = "find_arrow --previous", desc = "Previous match" },
	{ on = "f", run = "filter --smart", desc = "Filter files (ranger: find)" },
	{ on = "F", run = "search rg", desc = "Search content with ripgrep" },
	{ on = "<C-s>", run = "escape --search", desc = "Cancel search" },

	# ===== FZF/Zoxide =====
	{ on = ["z", "o"], run = "plugin zoxide", desc = "Zoxide jump" },
	{ on = ["z", "z"], run = "plugin zoxide", desc = "Zoxide jump" },
	{ on = ["c", "d"], run = "cd --interactive", desc = "Interactive cd" },

	# ===== File Operations =====
	# Copy (yank)
	{ on = ["y", "y"], run = "yank", desc = "Copy files" },
	{ on = ["u", "y"], run = "unyank", desc = "Cancel copy" },
	{ on = ["y", "a"], run = "yank", desc = "Append to copy" },

	# Cut
	{ on = ["d", "d"], run = "yank --cut", desc = "Cut files" },
	{ on = ["u", "d"], run = "unyank", desc = "Cancel cut" },
	{ on = ["d", "a"], run = "yank --cut", desc = "Append to cut" },

	# Paste
	{ on = ["p", "p"], run = "paste", desc = "Paste" },
	{ on = ["p", "o"], run = "paste --force", desc = "Paste (overwrite)" },
	{ on = ["p", "P"], run = "paste --force", desc = "Paste (overwrite)" },
	{ on = ["p", "l"], run = "link", desc = "Symlink (absolute path)" },
	{ on = ["p", "L"], run = "link --relative", desc = "Symlink (relative path)" },
	{ on = ["p", "h"], run = "hardlink", desc = "Hardlink" },

	# Delete
	{ on = ["d", "D"], run = "remove --permanently", desc = "Delete permanently" },
	{ on = ["d", "T"], run = "remove", desc = "Move to trash" },

	# ===== Copy Path =====
	{ on = ["y", "p"], run = "copy path", desc = "Copy full path" },
	{ on = ["y", "d"], run = "copy dirname", desc = "Copy directory path" },
	{ on = ["y", "n"], run = "copy filename", desc = "Copy filename" },
	{ on = ["y", "."], run = "copy name_without_ext", desc = "Copy filename (no extension)" },

	# ===== Rename =====
	{ on = ["c", "w"], run = "rename --empty=all", desc = "Rename (clear)" },
	{ on = "a", run = "rename --cursor=end", desc = "Rename (cursor at end)" },
	{ on = "A", run = "rename --cursor=end", desc = "Rename (cursor at end)" },
	{ on = "I", run = "rename --cursor=start", desc = "Rename (cursor at start)" },

	# ===== Create =====
	{ on = ["<Insert>"], run = "create", desc = "Create file" },
	{ on = ["<F7>"], run = "create --dir", desc = "Create directory" },

	# ===== Open With =====
	{ on = "i", run = "peek", desc = "Preview file" },
	{ on = "r", run = "open --interactive", desc = "Open with program" },
	{ on = "E", run = "open", desc = "Open/Edit with default program" },
	{ on = "<Enter>", run = "open", desc = "Open" },
	{ on = "<F3>", run = "peek", desc = "Preview file" },
	{ on = "<F4>", run = "open", desc = "Edit file" },

	# ===== Shell =====
	{ on = "S", run = 'shell "$SHELL" --block --confirm', desc = "Open Shell" },
	{ on = ":", run = "shell --interactive", desc = "Run command" },
	{ on = ";", run = "shell --interactive", desc = "Run command" },
	{ on = "!", run = "shell --interactive", desc = "Run Shell command" },
	{ on = "s", run = "shell --interactive", desc = "Run Shell command" },

	# ===== Help/Log =====
	{ on = "?", run = "help", desc = "Show help" },
	{ on = "<F1>", run = "help", desc = "Show help" },
	{ on = "W", run = "tasks_show", desc = "Show task log" },
	{ on = "w", run = "tasks_show", desc = "Show task manager" },

	# ===== Directory Jump (g prefix, ranger style) =====
	{ on = ["g", "h"], run = "cd ~", desc = "Home ~" },
	{ on = ["g", "e"], run = "cd /etc", desc = "/etc" },
	{ on = ["g", "u"], run = "cd /usr", desc = "/usr" },
	{ on = ["g", "d"], run = "cd /dev", desc = "/dev" },
	{ on = ["g", "l"], run = "cd -r .", desc = "Current directory root" },
	{ on = ["g", "o"], run = "cd /opt", desc = "/opt" },
	{ on = ["g", "v"], run = "cd /var", desc = "/var" },
	{ on = ["g", "m"], run = "cd /media", desc = "/media" },
	{ on = ["g", "i"], run = "cd /run/media", desc = "/run/media" },
	{ on = ["g", "M"], run = "cd /mnt", desc = "/mnt" },
	{ on = ["g", "s"], run = "cd /srv", desc = "/srv" },
	{ on = ["g", "p"], run = "cd /tmp", desc = "/tmp" },
	{ on = ["g", "r"], run = "cd /", desc = "Root /" },
	{ on = ["g", "/"], run = "cd /", desc = "Root /" },
	{ on = ["g", "c"], run = "cd ~/.config", desc = "Config directory" },
	{ on = ["g", "D"], run = "cd ~/Downloads", desc = "Downloads directory" },
	{ on = ["g", "<Space>"], run = "cd --interactive", desc = "Interactive jump" },

	# ===== Sort (o prefix, ranger style) =====
	{ on = ["o", "r"], run = "sort --reverse", desc = "Reverse sort" },
	{ on = ["o", "s"], run = ["sort size --reverse=no", "linemode size"], desc = "Sort by size" },
	{ on = ["o", "S"], run = ["sort size --reverse", "linemode size"], desc = "Sort by size (reverse)" },
	{ on = ["o", "n"], run = "sort natural --reverse=no", desc = "Natural sort" },
	{ on = ["o", "N"], run = "sort natural --reverse", desc = "Natural sort (reverse)" },
	{ on = ["o", "m"], run = ["sort mtime --reverse=no", "linemode mtime"], desc = "Sort by modified time" },
	{ on = ["o", "M"], run = ["sort mtime --reverse", "linemode mtime"], desc = "Sort by modified time (reverse)" },
	{ on = ["o", "c"], run = ["sort btime --reverse=no", "linemode ctime"], desc = "Sort by created time" },
	{ on = ["o", "C"], run = ["sort btime --reverse", "linemode ctime"], desc = "Sort by created time (reverse)" },
	{ on = ["o", "e"], run = "sort extension --reverse=no", desc = "Sort by extension" },
	{ on = ["o", "E"], run = "sort extension --reverse", desc = "Sort by extension (reverse)" },
	{ on = ["o", "a"], run = "sort alphabetical --reverse=no", desc = "Sort alphabetically" },
	{ on = ["o", "A"], run = "sort alphabetical --reverse", desc = "Sort alphabetically (reverse)" },
	{ on = ["o", "t"], run = "sort extension --reverse=no", desc = "Sort by type" },
	{ on = ["o", "T"], run = "sort extension --reverse", desc = "Sort by type (reverse)" },

	# ===== Settings (z prefix, ranger style) =====
	{ on = ["z", "h"], run = "hidden toggle", desc = "Toggle hidden files" },
	{ on = "<C-h>", run = "hidden toggle", desc = "Toggle hidden files" },
	{ on = "<Backspace>", run = "hidden toggle", desc = "Toggle hidden files" },
	{ on = ["z", "f"], run = "filter --smart", desc = "Filter files" },
	{ on = ["z", "p"], run = "spot", desc = "Toggle preview" },

	# ===== Display Mode (M prefix, ranger linemode) =====
	{ on = ["M", "s"], run = "linemode size", desc = "Show size" },
	{ on = ["M", "p"], run = "linemode perm", desc = "Show permissions" },
	{ on = ["M", "m"], run = "linemode mtime", desc = "Show modified time" },
	{ on = ["M", "c"], run = "linemode ctime", desc = "Show created time" },
	{ on = ["M", "o"], run = "linemode owner", desc = "Show owner" },
	{ on = ["M", "n"], run = "linemode none", desc = "Show no extra info" },

	# ===== Tabs =====
	{ on = ["g", "n"], run = "tab_create --current", desc = "New tab" },
	{ on = ["g", "c"], run = "tab_close", desc = "Close tab" },
	{ on = ["g", "t"], run = "tab_switch 1 --relative", desc = "Next tab" },
	{ on = ["g", "T"], run = "tab_switch -1 --relative", desc = "Previous tab" },
	{ on = "<Tab>", run = "tab_switch 1 --relative", desc = "Next tab" },
	{ on = "<S-Tab>", run = "tab_switch -1 --relative", desc = "Previous tab" },
	{ on = "<C-w>", run = "tab_close", desc = "Close tab" },
	{ on = ["u", "q"], run = "tab_close", desc = "Close tab (uq)" },

	{ on = "<A-1>", run = "tab_switch 0", desc = "Switch to tab 1" },
	{ on = "<A-2>", run = "tab_switch 1", desc = "Switch to tab 2" },
	{ on = "<A-3>", run = "tab_switch 2", desc = "Switch to tab 3" },
	{ on = "<A-4>", run = "tab_switch 3", desc = "Switch to tab 4" },
	{ on = "<A-5>", run = "tab_switch 4", desc = "Switch to tab 5" },
	{ on = "<A-6>", run = "tab_switch 5", desc = "Switch to tab 6" },
	{ on = "<A-7>", run = "tab_switch 6", desc = "Switch to tab 7" },
	{ on = "<A-8>", run = "tab_switch 7", desc = "Switch to tab 8" },
	{ on = "<A-9>", run = "tab_switch 8", desc = "Switch to tab 9" },

	# Number keys switch tabs
	{ on = "1", run = "tab_switch 0", desc = "Switch to tab 1" },
	{ on = "2", run = "tab_switch 1", desc = "Switch to tab 2" },
	{ on = "3", run = "tab_switch 2", desc = "Switch to tab 3" },
	{ on = "4", run = "tab_switch 3", desc = "Switch to tab 4" },
	{ on = "5", run = "tab_switch 4", desc = "Switch to tab 5" },
	{ on = "6", run = "tab_switch 5", desc = "Switch to tab 6" },
	{ on = "7", run = "tab_switch 6", desc = "Switch to tab 7" },
	{ on = "8", run = "tab_switch 7", desc = "Switch to tab 8" },
	{ on = "9", run = "tab_switch 8", desc = "Switch to tab 9" },

	# ===== Midnight Commander style (F keys) =====
	{ on = "<F1>", run = "help", desc = "Help" },
	{ on = "<F2>", run = "rename --cursor=end", desc = "Rename" },
	{ on = "<F3>", run = "peek", desc = "Preview" },
	{ on = "<F4>", run = "open", desc = "Edit" },
	{ on = "<F5>", run = "yank", desc = "Copy" },
	{ on = "<F6>", run = "yank --cut", desc = "Cut" },
	{ on = "<F7>", run = "create --dir", desc = "Create directory" },
	{ on = "<F8>", run = "remove", desc = "Delete" },
	{ on = "<F10>", run = "quit", desc = "Quit" },

	# ===== Lazygit =====
	{ on = "<C-g>", run = "shell --confirm --block lazygit", desc = "Lazygit" },

	# ===== Directory Size =====
	{ on = ["d", "c"], run = "plugin --sync max-preview", desc = "Calculate directory size" },

	# ===== Bookmarks (using yamb plugin) =====
	# Configured in prepend_keymap
]

[tasks]

keymap = [
	{ on = "<Esc>", run = "close", desc = "Close task manager" },
	{ on = "q", run = "close", desc = "Close task manager" },

	{ on = "k", run = "arrow -1", desc = "Move up" },
	{ on = "j", run = "arrow 1", desc = "Move down" },
	{ on = "<Up>", run = "arrow -1", desc = "Move up" },
	{ on = "<Down>", run = "arrow 1", desc = "Move down" },

	{ on = "<Enter>", run = "inspect", desc = "Inspect task" },
	{ on = "x", run = "cancel", desc = "Cancel task" },
	{ on = ["d", "d"], run = "cancel", desc = "Cancel task (dd)" },
	{ on = "<Delete>", run = "cancel", desc = "Cancel task" },

	{ on = "<F1>", run = "help", desc = "Help" },
]

[select]

keymap = [
	{ on = "<Esc>", run = "close", desc = "Cancel selection" },
	{ on = "<C-c>", run = "close", desc = "Cancel selection" },
	{ on = "<Enter>", run = "close --submit", desc = "Confirm selection" },
	{ on = "q", run = "close", desc = "Cancel selection" },

	{ on = "k", run = "arrow -1", desc = "Move up" },
	{ on = "j", run = "arrow 1", desc = "Move down" },
	{ on = "<Up>", run = "arrow -1", desc = "Move up" },
	{ on = "<Down>", run = "arrow 1", desc = "Move down" },

	{ on = ["g", "g"], run = "arrow -99999999", desc = "Go to top" },
	{ on = "G", run = "arrow 99999999", desc = "Go to bottom" },

	{ on = "<F1>", run = "help", desc = "Help" },
]

[input]

keymap = [
	{ on = "<C-c>", run = "close", desc = "Cancel input" },
	{ on = "<Enter>", run = "close --submit", desc = "Confirm input" },
	{ on = "<Esc>", run = "escape", desc = "Return to normal mode or cancel" },

	# Mode switch
	{ on = "i", run = "insert", desc = "Insert mode" },
	{ on = "a", run = "insert --append", desc = "Append mode" },
	{ on = "I", run = ["move -999", "insert"], desc = "Insert at start" },
	{ on = "A", run = ["move 999", "insert --append"], desc = "Append at end" },
	{ on = "v", run = "visual", desc = "Visual mode" },
	{ on = "V", run = ["move -999", "visual", "move 999"], desc = "Select all" },

	# Movement
	{ on = "h", run = "move -1", desc = "Move left" },
	{ on = "l", run = "move 1", desc = "Move right" },
	{ on = "<Left>", run = "move -1", desc = "Move left" },
	{ on = "<Right>", run = "move 1", desc = "Move right" },
	{ on = "<Home>", run = "move -999", desc = "Start of line" },
	{ on = "<End>", run = "move 999", desc = "End of line" },
	{ on = "0", run = "move -999", desc = "Start of line" },
	{ on = "$", run = "move 999", desc = "End of line" },

	# Word movement
	{ on = "b", run = "backward", desc = "Previous word" },
	{ on = "w", run = "forward", desc = "Next word" },
	{ on = "<A-b>", run = "backward", desc = "Previous word" },
	{ on = "<A-f>", run = "forward", desc = "Next word" },

	# Delete
	{ on = "<Backspace>", run = "backspace", desc = "Delete previous character" },
	{ on = "<Delete>", run = "backspace --under", desc = "Delete current character" },
	{ on = "<C-h>", run = "backspace", desc = "Delete previous character" },
	{ on = "<C-d>", run = "backspace --under", desc = "Delete current character" },

	# Line editing
	{ on = "<C-u>", run = "kill bol", desc = "Delete to start of line" },
	{ on = "<C-k>", run = "kill eol", desc = "Delete to end of line" },
	{ on = "<C-w>", run = "kill backward", desc = "Delete previous word" },
	{ on = "<A-d>", run = "kill forward", desc = "Delete next word" },

	# Emacs style
	{ on = "<C-a>", run = "move -999", desc = "Start of line" },
	{ on = "<C-e>", run = "move 999", desc = "End of line" },
	{ on = "<C-b>", run = "move -1", desc = "Move left" },
	{ on = "<C-f>", run = "move 1", desc = "Move right" },

	# Cut/Copy/Paste
	{ on = "d", run = "delete --cut", desc = "Cut selection" },
	{ on = "D", run = ["delete --cut", "move 999"], desc = "Cut to end of line" },
	{ on = "c", run = "delete --cut --insert", desc = "Cut and insert" },
	{ on = "C", run = ["delete --cut --insert", "move 999"], desc = "Cut to end of line and insert" },
	{ on = "x", run = ["delete --cut", "move 1 --in-operating"], desc = "Cut current character" },
	{ on = "y", run = "yank", desc = "Copy selection" },
	{ on = "p", run = "paste", desc = "Paste" },
	{ on = "P", run = "paste --before", desc = "Paste before" },
	{ on = "<C-y>", run = "paste", desc = "Paste" },

	# Undo/Redo
	{ on = "u", run = "undo", desc = "Undo" },
	{ on = "<C-r>", run = "redo", desc = "Redo" },

	{ on = "<F1>", run = "help", desc = "Help" },
]

[completion]

keymap = [
	{ on = "<C-c>", run = "close", desc = "Cancel completion" },
	{ on = "<Esc>", run = "close", desc = "Cancel completion" },
	{ on = "<Tab>", run = "close --submit", desc = "Confirm completion" },
	{ on = "<S-Tab>", run = "arrow -1", desc = "Previous item" },
	{ on = "<Enter>", run = ["close --submit", "close_input --submit"], desc = "Confirm completion and input" },

	{ on = "<C-k>", run = "arrow -1", desc = "Move up" },
	{ on = "<C-j>", run = "arrow 1", desc = "Move down" },
	{ on = "<C-p>", run = "arrow -1", desc = "Previous item" },
	{ on = "<C-n>", run = "arrow 1", desc = "Next item" },
	{ on = "<Up>", run = "arrow -1", desc = "Move up" },
	{ on = "<Down>", run = "arrow 1", desc = "Move down" },

	{ on = "<F1>", run = "help", desc = "Help" },
]

[help]

keymap = [
	{ on = "<Esc>", run = "escape", desc = "Clear filter or close help" },
	{ on = "q", run = "close", desc = "Close help" },
	{ on = "<C-c>", run = "close", desc = "Close help" },

	# Navigation
	{ on = "k", run = "arrow -1", desc = "Move up" },
	{ on = "j", run = "arrow 1", desc = "Move down" },
	{ on = "<Up>", run = "arrow -1", desc = "Move up" },
	{ on = "<Down>", run = "arrow 1", desc = "Move down" },

	{ on = ["g", "g"], run = "arrow -99999999", desc = "Go to top" },
	{ on = "G", run = "arrow 99999999", desc = "Go to bottom" },

	# Filter
	{ on = "/", run = "filter", desc = "Filter help items" },
	{ on = "f", run = "filter", desc = "Filter help items" },
]
