# Yazi keymap - Ranger compatible key bindings
# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
"$schema" = "https://yazi-rs.github.io/schemas/keymap.json"

[mgr]
prepend_keymap = [
	{ on = "<Enter>", run = 'plugin smart-enter' },
	{ on = "l", run = 'plugin smart-enter' },
	# Bookmarks (ranger style: `<key> or '<key> to jump, m<key> to set)
	{ on = ["`", "`"], run = "plugin yamb --args=jump_by_fzf", desc = "Jump to bookmark" },
	{ on = ["'", "'"], run = "plugin yamb --args=jump_by_fzf", desc = "Jump to bookmark" },
	{ on = ["`", "a"], run = "plugin yamb --args=save", desc = "Add bookmark" },
	{ on = ["`", "r"], run = "plugin yamb --args=delete_by_key", desc = "Delete bookmark" },
]

keymap = [
	# ===== Basic Operations (ranger style) =====
	{ on = "<Esc>", run = "escape", desc = "Exit visual mode/clear selection/cancel" },
	{ on = "q", run = "close", desc = "Close tab or quit" },
	{ on = "Q", run = "quit --no-cwd-file", desc = "Quit all" },
	{ on = ["Z", "Z"], run = "quit", desc = "Quit (ZZ)" },
	{ on = ["Z", "Q"], run = "quit --no-cwd-file", desc = "Quit without cwd (ZQ)" },

	{ on = "R", run = "refresh", desc = "Reload cwd" },
	{ on = "<C-r>", run = "refresh", desc = "Reset" },
	{ on = "<C-l>", run = "refresh", desc = "Redraw window" },
	{ on = "<C-c>", run = "escape", desc = "Abort" },
	{ on = "~", run = "help", desc = "Toggle viewmode (help in yazi)" },

	{ on = "i", run = "peek", desc = "Display file" },
	{ on = "<A-j>", run = "seek 5", desc = "Scroll preview down" },
	{ on = "<A-k>", run = "seek -5", desc = "Scroll preview up" },
	{ on = "?", run = "help", desc = "Help" },
	{ on = "W", run = "tasks_show", desc = "Display log" },
	{ on = "w", run = "tasks_show", desc = "Taskview open" },
	{ on = "S", run = 'shell "$SHELL" --block --confirm', desc = "Open shell $SHELL" },

	{ on = ":", run = "shell --interactive", desc = "Console" },
	{ on = ";", run = "shell --interactive", desc = "Console" },
	{ on = "!", run = "shell --interactive", desc = "Shell command" },
	{ on = "s", run = "shell --interactive", desc = "Shell command" },
	{ on = "@", run = "shell --interactive", desc = "Shell with selection" },
	{ on = "r", run = "open --interactive", desc = "Open with" },
	{ on = "f", run = "find --smart", desc = "Find (scout)" },
	{ on = ["c", "d"], run = "cd --interactive", desc = "cd command" },

	# ===== Linemode (M prefix, ranger style) =====
	{ on = ["M", "f"], run = "linemode none", desc = "Linemode filename" },
	{ on = ["M", "i"], run = "linemode size", desc = "Linemode fileinfo" },
	{ on = ["M", "m"], run = "linemode mtime", desc = "Linemode mtime" },
	{ on = ["M", "h"], run = "linemode mtime", desc = "Linemode humanreadablemtime" },
	{ on = ["M", "p"], run = "linemode perm", desc = "Linemode permissions" },
	{ on = ["M", "s"], run = "linemode size", desc = "Linemode sizemtime" },
	{ on = ["M", "H"], run = "linemode size", desc = "Linemode sizehumanreadablemtime" },
	{ on = ["M", "o"], run = "linemode owner", desc = "Linemode owner" },

	# ===== Tagging / Marking (ranger style) =====
	{ on = "t", run = "toggle", desc = "Tag toggle (toggle selection)" },
	{ on = ["u", "t"], run = "escape --select", desc = "Tag remove (clear selection)" },
	{ on = "<Space>", run = ["toggle", "arrow 1"], desc = "Mark files toggle" },
	{ on = "v", run = "toggle_all", desc = "Mark all toggle (invert)" },
	{ on = ["u", "v"], run = "escape --select", desc = "Unmark all" },
	{ on = "V", run = "visual_mode", desc = "Toggle visual mode" },
	{ on = ["u", "V"], run = "visual_mode --unset", desc = "Toggle visual mode reverse" },

	# ===== Midnight Commander bindings (F keys) =====
	{ on = "<F1>", run = "help", desc = "Help" },
	{ on = "<F2>", run = "rename --cursor=end", desc = "Rename append" },
	{ on = "<F3>", run = "peek", desc = "Display file" },
	{ on = "<F4>", run = "open", desc = "Edit" },
	{ on = "<F5>", run = "yank", desc = "Copy" },
	{ on = "<F6>", run = "yank --cut", desc = "Cut" },
	{ on = "<F7>", run = "create --dir", desc = "Mkdir" },
	{ on = "<F8>", run = "remove", desc = "Delete" },
	{ on = "<F10>", run = "quit", desc = "Exit" },

	# ===== Navigation (VIM-like, ranger style) =====
	{ on = "<Up>", run = "arrow -1", desc = "Move up" },
	{ on = "<Down>", run = "arrow 1", desc = "Move down" },
	{ on = "<Left>", run = "leave", desc = "Move left" },
	{ on = "<Right>", run = "enter", desc = "Move right" },
	{ on = "<Home>", run = "arrow -99999999", desc = "Move to top" },
	{ on = "<End>", run = "arrow 99999999", desc = "Move to bottom" },
	{ on = "<PageDown>", run = "arrow 100%", desc = "Page down" },
	{ on = "<PageUp>", run = "arrow -100%", desc = "Page up" },
	{ on = "<Enter>", run = "enter", desc = "Move right / Open" },
	{ on = "<Insert>", run = "create", desc = "Touch" },

	{ on = "k", run = "arrow -1", desc = "Move up" },
	{ on = "j", run = "arrow 1", desc = "Move down" },
	{ on = "h", run = "leave", desc = "Move left" },
	{ on = "l", run = "enter", desc = "Move right" },
	{ on = ["g", "g"], run = "arrow -99999999", desc = "Move to top" },
	{ on = "G", run = "arrow 99999999", desc = "Move to bottom" },
	{ on = "<C-f>", run = "arrow 100%", desc = "Page down" },
	{ on = "<C-b>", run = "arrow -100%", desc = "Page up" },

	{ on = "J", run = "arrow 50%", desc = "Half page down" },
	{ on = "K", run = "arrow -50%", desc = "Half page up" },
	{ on = "<C-d>", run = "arrow 50%", desc = "Half page down" },
	{ on = "<C-u>", run = "arrow -50%", desc = "Half page up" },

	# ===== Jumping around (ranger style) =====
	{ on = "H", run = "back", desc = "History go -1" },
	{ on = "L", run = "forward", desc = "History go 1" },
	{ on = "]", run = "parent_arrow 1", desc = "Move parent 1" },
	{ on = "[", run = "parent_arrow -1", desc = "Move parent -1" },

	{ on = ["g", "h"], run = "cd ~", desc = "cd ~" },
	{ on = ["g", "e"], run = "cd /etc", desc = "cd /etc" },
	{ on = ["g", "u"], run = "cd /usr", desc = "cd /usr" },
	{ on = ["g", "d"], run = "cd /dev", desc = "cd /dev" },
	{ on = ["g", "l"], run = "cd -r .", desc = "cd -r ." },
	{ on = ["g", "L"], run = "reveal", desc = "cd -r %f" },
	{ on = ["g", "o"], run = "cd /opt", desc = "cd /opt" },
	{ on = ["g", "v"], run = "cd /var", desc = "cd /var" },
	{ on = ["g", "m"], run = "cd /media", desc = "cd /media" },
	{ on = ["g", "i"], run = "cd /run/media", desc = "cd /run/media/$USER" },
	{ on = ["g", "M"], run = "cd /mnt", desc = "cd /mnt" },
	{ on = ["g", "s"], run = "cd /srv", desc = "cd /srv" },
	{ on = ["g", "p"], run = "cd /tmp", desc = "cd /tmp" },
	{ on = ["g", "r"], run = "cd /", desc = "cd /" },
	{ on = ["g", "/"], run = "cd /", desc = "cd /" },
	{ on = ["g", "c"], run = "cd ~/.config", desc = "cd ~/.config" },
	{ on = ["g", "D"], run = "cd ~/Downloads", desc = "cd ~/Downloads" },
	{ on = ["g", "<Space>"], run = "cd --interactive", desc = "cd interactive" },

	# ===== External Programs (ranger style) =====
	{ on = "E", run = "open", desc = "Edit" },
	{ on = ["d", "u"], run = "shell --block 'du --max-depth=1 -h --apparent-size'", desc = "du" },
	{ on = ["d", "U"], run = "shell --block 'du --max-depth=1 -h --apparent-size | sort -rh'", desc = "du sorted" },
	{ on = ["y", "p"], run = "copy path", desc = "Yank path" },
	{ on = ["y", "d"], run = "copy dirname", desc = "Yank dir" },
	{ on = ["y", "n"], run = "copy filename", desc = "Yank name" },
	{ on = ["y", "."], run = "copy name_without_ext", desc = "Yank name without extension" },

	# ===== Filesystem Operations (ranger style) =====
	{ on = "=", run = "shell --interactive 'chmod '", desc = "chmod" },

	{ on = ["c", "w"], run = "rename --empty=all", desc = "Rename (clear)" },
	{ on = "a", run = "rename --cursor=end", desc = "Rename append" },
	{ on = "A", run = "rename --cursor=end", desc = "Rename" },
	{ on = "I", run = "rename --cursor=start", desc = "Rename prepend" },

	{ on = ["p", "p"], run = "paste", desc = "Paste" },
	{ on = ["p", "o"], run = "paste --force", desc = "Paste overwrite" },
	{ on = ["p", "O"], run = "paste --force", desc = "Paste overwrite" },
	{ on = ["p", "P"], run = "paste", desc = "Paste append" },
	{ on = ["p", "l"], run = "link", desc = "Paste symlink" },
	{ on = ["p", "L"], run = "link --relative", desc = "Paste symlink relative" },
	{ on = ["p", "h", "l"], run = "hardlink", desc = "Paste hardlink" },

	{ on = ["d", "D"], run = "remove --permanently", desc = "Delete" },
	{ on = ["d", "T"], run = "remove", desc = "Trash" },

	{ on = ["d", "d"], run = "yank --cut", desc = "Cut" },
	{ on = ["u", "d"], run = "unyank", desc = "Uncut" },
	{ on = ["d", "a"], run = "yank --cut", desc = "Cut mode=add" },

	{ on = ["y", "y"], run = "yank", desc = "Copy" },
	{ on = ["u", "y"], run = "unyank", desc = "Uncut (cancel copy)" },
	{ on = ["y", "a"], run = "yank", desc = "Copy mode=add" },

	# ===== Searching (ranger style) =====
	{ on = "/", run = "find --smart", desc = "Search" },
	{ on = "n", run = "find_arrow", desc = "Search next" },
	{ on = "N", run = "find_arrow --previous", desc = "Search next forward=False" },

	# ===== Tabs (ranger style) =====
	{ on = "<C-w>", run = "tab_close", desc = "Tab close" },
	{ on = "<Tab>", run = "tab_switch 1 --relative", desc = "Tab move 1" },
	{ on = "<S-Tab>", run = "tab_switch -1 --relative", desc = "Tab move -1" },
	{ on = "<A-Right>", run = "tab_switch 1 --relative", desc = "Tab move 1" },
	{ on = "<A-Left>", run = "tab_switch -1 --relative", desc = "Tab move -1" },
	{ on = ["g", "t"], run = "tab_switch 1 --relative", desc = "Tab move 1" },
	{ on = ["g", "T"], run = "tab_switch -1 --relative", desc = "Tab move -1" },
	{ on = ["g", "n"], run = "tab_create --current", desc = "Tab new" },
	{ on = ["g", "c"], run = "tab_close", desc = "Tab close" },
	{ on = ["u", "q"], run = "tab_close", desc = "Tab restore (close in yazi)" },
	{ on = "<A-1>", run = "tab_switch 0", desc = "Tab open 1" },
	{ on = "<A-2>", run = "tab_switch 1", desc = "Tab open 2" },
	{ on = "<A-3>", run = "tab_switch 2", desc = "Tab open 3" },
	{ on = "<A-4>", run = "tab_switch 3", desc = "Tab open 4" },
	{ on = "<A-5>", run = "tab_switch 4", desc = "Tab open 5" },
	{ on = "<A-6>", run = "tab_switch 5", desc = "Tab open 6" },
	{ on = "<A-7>", run = "tab_switch 6", desc = "Tab open 7" },
	{ on = "<A-8>", run = "tab_switch 7", desc = "Tab open 8" },
	{ on = "<A-9>", run = "tab_switch 8", desc = "Tab open 9" },
	{ on = "<A-r>", run = "tab_swap 1", desc = "Tab shift 1" },
	{ on = "<A-l>", run = "tab_swap -1", desc = "Tab shift -1" },

	# ===== Sorting (o prefix, ranger style) =====
	{ on = ["o", "r"], run = "sort --reverse", desc = "Sort reverse toggle" },
	{ on = ["o", "z"], run = "sort random --reverse=no", desc = "Sort random" },
	{ on = ["o", "s"], run = ["sort size --reverse=no", "linemode size"], desc = "Sort size" },
	{ on = ["o", "b"], run = "sort alphabetical --reverse=no", desc = "Sort basename" },
	{ on = ["o", "n"], run = "sort natural --reverse=no", desc = "Sort natural" },
	{ on = ["o", "m"], run = ["sort mtime --reverse=no", "linemode mtime"], desc = "Sort mtime" },
	{ on = ["o", "c"], run = ["sort btime --reverse=no", "linemode ctime"], desc = "Sort ctime" },
	{ on = ["o", "a"], run = ["sort mtime --reverse=no", "linemode mtime"], desc = "Sort atime" },
	{ on = ["o", "t"], run = "sort extension --reverse=no", desc = "Sort type" },
	{ on = ["o", "e"], run = "sort extension --reverse=no", desc = "Sort extension" },

	{ on = ["o", "S"], run = ["sort size --reverse", "linemode size"], desc = "Sort size reverse" },
	{ on = ["o", "B"], run = "sort alphabetical --reverse", desc = "Sort basename reverse" },
	{ on = ["o", "N"], run = "sort natural --reverse", desc = "Sort natural reverse" },
	{ on = ["o", "M"], run = ["sort mtime --reverse", "linemode mtime"], desc = "Sort mtime reverse" },
	{ on = ["o", "C"], run = ["sort btime --reverse", "linemode ctime"], desc = "Sort ctime reverse" },
	{ on = ["o", "A"], run = ["sort mtime --reverse", "linemode mtime"], desc = "Sort atime reverse" },
	{ on = ["o", "T"], run = "sort extension --reverse", desc = "Sort type reverse" },
	{ on = ["o", "E"], run = "sort extension --reverse", desc = "Sort extension reverse" },

	{ on = ["d", "c"], run = "plugin --sync max-preview", desc = "Get cumulative size" },

	# ===== Settings (z prefix, ranger style) =====
	{ on = ["z", "c"], run = "spot", desc = "Toggle collapse_preview" },
	{ on = ["z", "d"], run = "sort --dir-first", desc = "Toggle sort_directories_first" },
	{ on = ["z", "h"], run = "hidden toggle", desc = "Toggle show_hidden" },
	{ on = "<C-h>", run = "hidden toggle", desc = "Toggle show_hidden" },
	{ on = "<Backspace>", run = "hidden toggle", desc = "Toggle show_hidden" },
	{ on = ["z", "i"], run = "spot", desc = "Toggle preview_images" },
	{ on = ["z", "p"], run = "spot", desc = "Toggle preview_files" },
	{ on = ["z", "P"], run = "spot", desc = "Toggle preview_directories" },
	{ on = ["z", "s"], run = "sort --ignore-case", desc = "Toggle sort_case_insensitive" },
	{ on = ["z", "v"], run = "spot", desc = "Toggle use_preview_script" },
	{ on = ["z", "f"], run = "filter --smart", desc = "Filter" },
	{ on = ["z", "z"], run = "filter --smart", desc = "Filter (same as zf)" },

	# ===== Filter stack (. prefix, ranger style) =====
	{ on = [".", "d"], run = "filter --smart dir", desc = "Filter type d" },
	{ on = [".", "f"], run = "filter --smart file", desc = "Filter type f" },
	{ on = [".", "n"], run = "filter --smart", desc = "Filter name" },
	{ on = [".", "c"], run = "escape --filter", desc = "Filter clear" },
	{ on = [".", "."], run = "filter --smart", desc = "Filter show" },

	# ===== Bookmarks (ranger style) =====
	# Using yamb plugin, configured in prepend_keymap
	# `<any> = enter_bookmark, '<any> = enter_bookmark
	# m<any> = set_bookmark, um<any> = unset_bookmark

	# ===== Dragon Drop =====
	{ on = "<C-n>", run = "shell --confirm 'dragon-drop -a -x $@'", desc = "Dragon drop" },

	# ===== Lazygit =====
	{ on = "<C-g>", run = "shell --confirm --block lazygit", desc = "Lazygit" },
]

[tasks]

keymap = [
	# Movement (ranger taskview style)
	{ on = "<Up>", run = "arrow -1", desc = "Taskview move up" },
	{ on = "<Down>", run = "arrow 1", desc = "Taskview move down" },
	{ on = "<Home>", run = "arrow -99999999", desc = "Taskview move to top" },
	{ on = "<End>", run = "arrow 99999999", desc = "Taskview move to bottom" },
	{ on = "<PageDown>", run = "arrow 100%", desc = "Taskview page down" },
	{ on = "<PageUp>", run = "arrow -100%", desc = "Taskview page up" },
	{ on = "<C-d>", run = "arrow 50%", desc = "Taskview half page down" },
	{ on = "<C-u>", run = "arrow -50%", desc = "Taskview half page up" },

	{ on = "k", run = "arrow -1", desc = "Move up" },
	{ on = "j", run = "arrow 1", desc = "Move down" },
	{ on = "<C-p>", run = "arrow -1", desc = "Move up" },
	{ on = "<C-n>", run = "arrow 1", desc = "Move down" },
	{ on = "<Enter>", run = "arrow 1", desc = "Move down" },
	{ on = ["g", "g"], run = "arrow -99999999", desc = "Go to top" },
	{ on = "G", run = "arrow 99999999", desc = "Go to bottom" },
	{ on = "u", run = "arrow -50%", desc = "Half page up" },
	{ on = "n", run = "arrow 100%", desc = "Page down" },
	{ on = "p", run = "arrow -100%", desc = "Page up" },
	{ on = "b", run = "arrow -100%", desc = "Page up" },
	{ on = "<C-f>", run = "arrow 100%", desc = "Page down" },
	{ on = "<C-b>", run = "arrow -100%", desc = "Page up" },

	# Task operations
	{ on = "J", run = "inspect", desc = "Task move priority down" },
	{ on = "K", run = "inspect", desc = "Task move priority up" },
	{ on = ["d", "d"], run = "cancel", desc = "Task remove" },
	{ on = "<Delete>", run = "cancel", desc = "Task remove" },
	{ on = "<Enter>", run = "inspect", desc = "Inspect task" },
	{ on = "x", run = "cancel", desc = "Cancel task" },

	# Basic
	{ on = "<C-l>", run = "close", desc = "Redraw window" },
	{ on = "<Esc>", run = "close", desc = "Taskview close" },
	{ on = "q", run = "close", desc = "Close" },
	{ on = "Q", run = "close", desc = "Close" },
	{ on = "w", run = "close", desc = "Close" },
	{ on = "<C-c>", run = "close", desc = "Close" },

	{ on = "<F1>", run = "help", desc = "Help" },
]

[select]

keymap = [
	{ on = "<Esc>", run = "close", desc = "Cancel selection" },
	{ on = "<C-c>", run = "close", desc = "Cancel selection" },
	{ on = "<Enter>", run = "close --submit", desc = "Confirm selection" },
	{ on = "q", run = "close", desc = "Cancel selection" },

	{ on = "k", run = "arrow -1", desc = "Move up" },
	{ on = "j", run = "arrow 1", desc = "Move down" },
	{ on = "<Up>", run = "arrow -1", desc = "Move up" },
	{ on = "<Down>", run = "arrow 1", desc = "Move down" },

	{ on = ["g", "g"], run = "arrow -99999999", desc = "Go to top" },
	{ on = "G", run = "arrow 99999999", desc = "Go to bottom" },

	{ on = "<F1>", run = "help", desc = "Help" },
]

[input]

keymap = [
	# Basic (ranger console style)
	{ on = "<Tab>", run = "complete", desc = "Tab completion" },
	{ on = "<S-Tab>", run = "complete --previous", desc = "Tab completion reverse" },
	{ on = "<Esc>", run = "escape", desc = "Close/escape" },
	{ on = "<Enter>", run = "close --submit", desc = "Execute" },
	{ on = "<C-l>", run = "close", desc = "Redraw" },
	{ on = "<C-c>", run = "close", desc = "Close" },
	{ on = "<C-j>", run = "close --submit", desc = "Execute" },

	# Move around (ranger console style)
	{ on = "<Up>", run = "history --previous", desc = "History move -1" },
	{ on = "<Down>", run = "history --next", desc = "History move 1" },
	{ on = "<Left>", run = "move -1", desc = "Move left" },
	{ on = "<Right>", run = "move 1", desc = "Move right" },
	{ on = "<Home>", run = "move -999", desc = "Move to start" },
	{ on = "<End>", run = "move 999", desc = "Move to end" },
	{ on = "<A-b>", run = "backward", desc = "Move word left" },
	{ on = "<A-f>", run = "forward", desc = "Move word right" },
	{ on = "<A-Left>", run = "backward", desc = "Move word left" },
	{ on = "<A-Right>", run = "forward", desc = "Move word right" },

	# Line Editing (ranger console style)
	{ on = "<Backspace>", run = "backspace", desc = "Delete char left" },
	{ on = "<Delete>", run = "backspace --under", desc = "Delete char right" },
	{ on = "<C-w>", run = "kill backward", desc = "Delete word" },
	{ on = "<A-d>", run = "kill forward", desc = "Delete word forward" },
	{ on = "<C-k>", run = "kill eol", desc = "Delete to end" },
	{ on = "<C-u>", run = "kill bol", desc = "Delete to start" },
	{ on = "<C-y>", run = "paste", desc = "Paste" },

	# Emacs style (ranger console style)
	{ on = "<C-g>", run = "close", desc = "Close" },
	{ on = "<C-p>", run = "history --previous", desc = "History up" },
	{ on = "<C-n>", run = "history --next", desc = "History down" },
	{ on = "<C-b>", run = "move -1", desc = "Move left" },
	{ on = "<C-f>", run = "move 1", desc = "Move right" },
	{ on = "<C-a>", run = "move -999", desc = "Move to start" },
	{ on = "<C-e>", run = "move 999", desc = "Move to end" },
	{ on = "<C-d>", run = "backspace --under", desc = "Delete char right" },
	{ on = "<C-h>", run = "backspace", desc = "Delete char left" },

	# Vim mode support
	{ on = "i", run = "insert", desc = "Insert mode" },
	{ on = "a", run = "insert --append", desc = "Append mode" },
	{ on = "I", run = ["move -999", "insert"], desc = "Insert at start" },
	{ on = "A", run = ["move 999", "insert --append"], desc = "Append at end" },
	{ on = "v", run = "visual", desc = "Visual mode" },
	{ on = "V", run = ["move -999", "visual", "move 999"], desc = "Select all" },
	{ on = "h", run = "move -1", desc = "Move left" },
	{ on = "l", run = "move 1", desc = "Move right" },
	{ on = "0", run = "move -999", desc = "Move to start" },
	{ on = "$", run = "move 999", desc = "Move to end" },
	{ on = "b", run = "backward", desc = "Previous word" },
	{ on = "w", run = "forward", desc = "Next word" },

	# Cut/Copy/Paste
	{ on = "d", run = "delete --cut", desc = "Cut selection" },
	{ on = "D", run = ["delete --cut", "move 999"], desc = "Cut to end" },
	{ on = "c", run = "delete --cut --insert", desc = "Cut and insert" },
	{ on = "C", run = ["delete --cut --insert", "move 999"], desc = "Cut to end and insert" },
	{ on = "x", run = ["delete --cut", "move 1 --in-operating"], desc = "Cut char" },
	{ on = "y", run = "yank", desc = "Copy selection" },
	{ on = "p", run = "paste", desc = "Paste" },
	{ on = "P", run = "paste --before", desc = "Paste before" },

	# Undo/Redo
	{ on = "u", run = "undo", desc = "Undo" },
	{ on = "<C-r>", run = "redo", desc = "Redo" },

	{ on = "<F1>", run = "help", desc = "Help" },
]

[completion]

keymap = [
	{ on = "<C-c>", run = "close", desc = "Cancel completion" },
	{ on = "<Esc>", run = "close", desc = "Cancel completion" },
	{ on = "<Tab>", run = "close --submit", desc = "Confirm completion" },
	{ on = "<S-Tab>", run = "arrow -1", desc = "Previous item" },
	{ on = "<Enter>", run = ["close --submit", "close_input --submit"], desc = "Confirm and submit" },

	{ on = "<C-k>", run = "arrow -1", desc = "Move up" },
	{ on = "<C-j>", run = "arrow 1", desc = "Move down" },
	{ on = "<C-p>", run = "arrow -1", desc = "Previous item" },
	{ on = "<C-n>", run = "arrow 1", desc = "Next item" },
	{ on = "<Up>", run = "arrow -1", desc = "Move up" },
	{ on = "<Down>", run = "arrow 1", desc = "Move down" },

	{ on = "<F1>", run = "help", desc = "Help" },
]

[help]

keymap = [
	{ on = "<Esc>", run = "escape", desc = "Clear filter or close" },
	{ on = "q", run = "close", desc = "Close" },
	{ on = "<C-c>", run = "close", desc = "Close" },

	# Navigation
	{ on = "k", run = "arrow -1", desc = "Move up" },
	{ on = "j", run = "arrow 1", desc = "Move down" },
	{ on = "<Up>", run = "arrow -1", desc = "Move up" },
	{ on = "<Down>", run = "arrow 1", desc = "Move down" },

	{ on = ["g", "g"], run = "arrow -99999999", desc = "Go to top" },
	{ on = "G", run = "arrow 99999999", desc = "Go to bottom" },

	# Filter
	{ on = "/", run = "filter", desc = "Filter" },
	{ on = "f", run = "filter", desc = "Filter" },

	{ on = "<F1>", run = "help", desc = "Help" },
]
