# Noctalia v5 configuration migrated from i3 + Polybar.
# GUI changes are stored separately in ~/.local/state/noctalia/settings.toml
# and override this file.

config_version = 2

[shell]
app_icon_color = "on_surface_variant"
font_family = "MesloLGS NF"
lang = "zh-Hans"
date_format = "%A, %Y-%m-%d"
setup_wizard_enabled = false
polkit_agent = true
clipboard_history_max_entries = 200

[shell.panel]
transparency_mode = "glass"

[shell.launcher.providers.calculator]
prefix = ""

[shell.screenshot]
directory = "~/Pictures"
filename_pattern = "screenshot_%Y%m%d_%H%M%S"

[theme]
mode = "dark"
source = "community"
community_palette = "Catppuccin Lavender"

[wallpaper]
transition = ["fade", "wipe", "zoom"]
transition_duration = 900
directory = "~/Pictures"

[notification]
scale = 1.1
offset_x = 12

[osd]
offset_x = 12

[lockscreen]
fingerprint = false
blurred_desktop = true
blur_intensity = 0.55
tint_intensity = 0.35

# The i3 setup did not automatically lock or blank the screen, so these remain
# disabled. They can be enabled later without adding hypridle.
[idle.behavior.lock]
timeout = 1200
action = "lock"
enabled = false

[idle.behavior.screen-off]
timeout = 1260
action = "screen_off"
enabled = false

# External DP monitors usually need ddcutil; leave this off until `ddcutil
# detect` confirms that the displays support DDC/CI.
[brightness]
enable_ddcutil = false

[system.monitor]
network_poll_seconds = 1.0

[bar]
order = ["main"]

# Main DP-1 bar: mirrors the current Polybar layout.
[bar.main]
thickness = 40
background_opacity = 0.89999997988343239
border = "on_hover"
border_width = 1.0
radius = 0
concave_edge_corners = false
margin_ends = 0
padding = 10
widget_spacing = 8
scale = 1.5
font_family = "Maple Mono NL NFMono CN"
capsule = true
capsule_border = "on_primary"
color = "primary"
icon_color = "primary"
start = ["workspaces", "network"]
center = ["net-down", "net-up", "media"]
end = ["volume", "group:g1", "clock", "caffeine", "notifications", "tray"]

# The old DP-2 Polybar was deliberately minimal: workspaces plus date/Variety.
# Noctalia's wallpaper button replaces Variety here.
[bar.main.monitor.secondary]
match = "DP-2"
start = ["workspaces"]
center = []
end = ["clock", "wallpaper", "tray", "weather_2"]

[[bar.main.capsule_group]]
border = "on_primary"
enabled = true
fill = "surface_variant"
id = "g1"
members = ["cpu", "ram"]
opacity = 1.0
padding = 6.0

[widget.workspaces]
style = "regular"
display = "id"
max_label_chars = 2
labels_only_when_occupied = false
hide_when_empty = true
enable_scroll = true
focused_color = "primary"
occupied_color = "secondary"
empty_color = "surface_variant"
urgent_color = "error"
focused_output_only = true

[widget.net-down]
type = "sysmon"
stat = "net_rx"
interface = "enp2s0"
network_speed_unit = "auto"
network_speed_compact = true
display = "text"
show_label = true
label_min_width = 56

[widget.net-up]
type = "sysmon"
stat = "net_tx"
interface = "enp2s0"
network_speed_unit = "auto"
network_speed_compact = true
display = "text"
show_label = true
label_min_width = 56

[widget.media]
artist_first = false
hide_artist = false
hide_when_no_media = true
title_scroll = "on_hover"
max_length = 260
art_size = 20
enable_scroll = true

[widget.volume]
device = "output"
enable_scroll = true
scroll_step = 5
show_label = true
mute_color = "error"

[widget.ram]
stat = "ram_pct"
display = "text"
show_label = true
label_min_width = 0

[widget.cpu]
display = "text"
show_label = true
label_min_width = 0

[widget.clock]
format = "{:%H:%M}"
tooltip_format = "{:%A, %B %d, %Y, %H:%M:%S}"

[widget.tray]
hidden = []
pinned = []
drawer = false
match_adjacent_spacing = true

[widget.notifications]
hide_when_no_unread = false

[widget.network]
show_vpn_label = true

[widget.weather_2]
show_condition = true
type = "jesse/hfweather:weather"

[plugin_settings."jesse/hfweather"]
api_host = ""
api_key = ""
location = "北京"

[plugins]
enabled = ["noctalia/wallhaven", "jesse/hfweather"]
